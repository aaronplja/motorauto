  <div class="page" id="page-catalog" data-page="catalog">
  <main class="stage-shell page-wrap" id="main-catalog-view">
    <aside class="cat-side">
    <header class="page-head">
        <div class="page-head-text">
          <span class="status-tag-verified">Archive</span>
          <h1 class="page-title" id="catalog-title">Le catalogue</h1>
          
        </div>
        
      </header>
    <a class="cta-btn btn-ghost cat-frise-btn" id="catalog-frise-btn" href="#/frise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18"/><circle cx="7" cy="12" r="2"/><circle cx="14" cy="12" r="2"/><path d="M7 10V6M14 14v4"/></svg>Frise chronologique</a>
    <p class="count-stream" id="results-count" aria-live="polite">Calcul de l'archive en cours…</p>
    <div class="toolbar-cluster">
      <span class="side-label">Catégorie</span>
      <div class="categories-scroll" id="body-filter-chips" role="group" aria-label="Carrosserie">
        <button type="button" class="filter-pill active" data-filter-type="all">Toutes</button>
        <button type="button" class="filter-pill" data-filter-type="Berline">Berline</button>
        <button type="button" class="filter-pill" data-filter-type="Coupé">Coupé &amp; Sport</button>
        <button type="button" class="filter-pill" data-filter-type="Break">Break</button>
        <button type="button" class="filter-pill" data-filter-type="Supercar">Supercar</button>
        <button type="button" class="filter-pill" data-filter-type="Le Mans">Le Mans</button>
        <button type="button" class="filter-pill" id="noimg-pill" hidden aria-pressed="false" title="Admin : fiches qui affichent encore l'image générique">Sans image</button>
      </div>
      <span class="side-label">Style</span>
      <div class="categories-scroll" id="genre-filter-chips" role="group" aria-label="Style de voiture">
        <button type="button" class="filter-pill active" data-genre="all">Tous</button>
        <button type="button" class="filter-pill" data-genre="suv">SUV</button>
        <button type="button" class="filter-pill" data-genre="ev">Électrique</button>
        <button type="button" class="filter-pill" data-genre="cabrio">Cabriolet</button>
        <button type="button" class="filter-pill" data-genre="pickup">Pick-up</button>
        <button type="button" class="filter-pill" data-genre="young">Youngtimer</button>
      </div>
      <details class="acc cat-acc" data-acc="cat-filters"><summary><span class="acc-t"><b>Plus de filtres</b><small>Époque, marque, tri, filtres avancés</small></span><span class="acc-count" id="cat-acc-count" hidden></span><svg class="acc-chev" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="acc-body">
      <span class="side-label">Époque</span>
      <div class="era-chips" id="era-chips" role="group" aria-label="Époque">
        <button type="button" class="filter-pill" data-era="0-1979">Avant 1980</button>
        <button type="button" class="filter-pill" data-era="1980-1999">1980 - 1999</button>
        <button type="button" class="filter-pill" data-era="2000-">2000 et +</button>
      </div>
      <div class="selectors-cluster">
        <label class="sort-cluster"><span class="sort-title">Marque</span>
          <select id="brand-select" class="custom-select" aria-label="Filtrer par marque"><option value="all">Toutes les marques</option></select>
        </label>
        <label class="sort-cluster"><span class="sort-title">Trier par</span>
          <select id="sort-select" class="custom-select" aria-label="Trier les véhicules">
            <option value="name-asc">Nom (A-Z)</option>
            <option value="power-desc">Puissance</option>
            <option value="speed-desc">Vitesse de pointe</option>
            <option value="zero-asc">0-100 km/h (le + rapide)</option>
            <option value="torque-desc">Couple</option>
            <option value="year-desc">Plus récentes</option>
            <option value="year-asc">Plus anciennes</option>
            <option value="likes-desc">Les plus aimées</option>
            <option value="rating-desc">Les mieux notées</option>
            <option value="rarity-desc">Échelon de la carte</option>
            <option value="ic-desc">IC (collection)</option>
            <option value="ip-desc">IP (performance)</option>
          </select>
        </label>
        <button type="button" class="cta-btn btn-ghost adv-toggle" id="adv-toggle" aria-expanded="false" aria-controls="adv-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          Filtres <span class="adv-count" id="adv-count" hidden>0</span>
        </button>
      </div>
      </div></details>
    </div>

    <div class="adv-panel" id="adv-panel" hidden>
      <div class="adv-grid">
        <label class="adv-field"><span>Transmission</span>
          <select id="adv-drive" class="custom-select"><option value="all">Toutes</option><option value="P">Propulsion</option><option value="T">Traction</option><option value="A">4x4 permanent</option><option value="E">4x4 enclenchable</option><option value="X">Propulsion transaxle</option><option value="M">Moteur central</option><option value="R">Moteur arrière</option></select></label>
        <label class="adv-field"><span>Usage circuit</span>
          <select id="adv-verdict" class="custom-select"><option value="all">Tous</option><option value="ideal">Idéale</option><option value="correct">Correcte</option><option value="watch">À surveiller</option><option value="avoid">Déconseillée</option><option value="race">Voiture de course</option></select></label>
        <label class="adv-field"><span>Moteur</span>
          <select id="adv-turbo" class="custom-select"><option value="all">Tous</option><option value="turbo">Turbo / compresseur</option><option value="atmo">Atmosphérique</option></select></label>
        <label class="adv-field"><span>Échelon de la carte</span>
          <select id="adv-rarity" class="custom-select"><option value="all">Toutes</option><option value="common">Série</option><option value="rare">Sport</option><option value="epic">Élite</option><option value="legendary">Prestige</option><option value="shiny">Apex</option><option value="mythic">Héritage</option></select></label>
        <label class="adv-field"><span>IC (collection)</span>
          <select id="adv-ic" class="custom-select"><option value="all">Tous</option><option value="F">F</option><option value="E">E</option><option value="D">D</option><option value="C">C</option><option value="B">B</option><option value="A">A</option><option value="Z">Z</option></select></label>
        <label class="adv-field"><span>IP (performance)</span>
          <select id="adv-ip" class="custom-select"><option value="all">Tous</option><option value="I">I</option><option value="II">II</option><option value="III">III</option><option value="IV">IV</option><option value="V">V</option><option value="VI">VI</option><option value="VII">VII</option><option value="VIII">VIII</option><option value="IX">IX</option><option value="X">X</option></select></label>
        <label class="adv-field"><span>Puissance min. (ch)</span><input type="number" id="adv-pmin" min="0" max="2000" inputmode="numeric" placeholder="ex. 150"></label>
        <label class="adv-field"><span>Puissance max. (ch)</span><input type="number" id="adv-pmax" min="0" max="2000" inputmode="numeric" placeholder="ex. 300"></label>
        <label class="adv-field"><span>0-100 km/h max. (s)</span><input type="number" id="adv-zero" min="1" max="30" step="0.1" inputmode="decimal" placeholder="ex. 6.5"></label>
        <label class="adv-field"><span>V-max min. (km/h)</span><input type="number" id="adv-vmax" min="0" max="500" inputmode="numeric" placeholder="ex. 220"></label>
        <label class="adv-field"><span>Produite à partir de</span><input type="number" id="adv-yfrom" min="1900" max="2100" inputmode="numeric" placeholder="ex. 1990"></label>
        <label class="adv-field"><span>Jusqu'en</span><input type="number" id="adv-yto" min="1900" max="2100" inputmode="numeric" placeholder="ex. 2005"></label>
      </div>
      <div class="adv-actions"><button type="button" class="cta-btn btn-ghost" id="adv-reset">Réinitialiser les filtres</button></div>
    </div>
    </aside>
    <div class="cat-main">
    <div class="catalog-search search-container" id="catalog-search-container">
      <div class="command-search-wrapper">
        <svg class="search-lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="catalog-search-input" placeholder="Rechercher un modèle, un moteur, une génération…" autocomplete="off" spellcheck="false" aria-label="Rechercher dans le catalogue" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="catalog-suggestions">
      </div>
      <div class="search-suggestions-dropdown" id="catalog-suggestions" role="listbox" aria-hidden="true"></div>
    </div>
    <div class="vehicles-dynamic-grid" id="vehicles-grid"></div>
    <nav class="pagination-bar" id="pagination-container" aria-label="Pagination du catalogue"></nav>
    </div>
  </main>
</div>
