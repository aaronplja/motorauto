  <div class="modal-layer" id="auth-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="modal-dialog auth-box">
      <div class="dialog-header">
        <div>
          <svg class="auth-mark" viewBox="-2 -2 55.5 64" aria-hidden="true"><polygon class="am1" points="0,60 12,60 31.5,0 19.5,0"/><polygon class="am2" points="20,60 32,60 51.5,0 39.5,0"/></svg>
          <h2 class="dialog-title" id="auth-title">Cockpit pilote</h2>
          <p class="dialog-sub">Synchronise tes chronos et ton écurie sur tous tes appareils</p>
          <p class="auth-reason" id="auth-reason" role="status" hidden></p>
        </div>
        <button type="button" class="dialog-close-btn" id="close-auth-modal" aria-label="Fermer">&times;</button>
      </div>
      <div class="dialog-tabs">
        <button class="dialog-tab-btn active" id="tab-login-btn" type="button">Connexion</button>
        <button class="dialog-tab-btn" id="tab-register-btn" type="button">Nouveau pilote</button>
      </div>
      <div class="dialog-body">
        <button type="button" class="google-auth-btn" id="google-login-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.14v3.15C3.15 21.32 7.21 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.14C.41 8.09 0 9.77 0 12s.41 3.91 1.14 5.39l4.13-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.21 0 3.15 2.68 1.14 6.61l4.13 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          <span>Continuer avec Google</span>
        </button>
        <div class="divider-or"><span>ou avec ton e-mail</span></div>

        <form class="auth-form active" id="login-form">
          <div class="input-stack"><label for="login-email">Adresse e-mail</label><input type="email" id="login-email" placeholder="pilote@motorauto.com" autocomplete="email" required></div>
          <div class="input-stack"><label for="login-password">Mot de passe</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required></div>
          <button type="button" class="link-btn auth-forgot" id="forgot-password-btn">Mot de passe oublié ?</button>
          <div class="form-feedback ok-txt" id="forgot-info" role="status"></div>
          <div class="form-feedback error-txt" id="login-error" role="alert"></div>
          <button type="submit" class="cta-btn fill-btn w-100" id="login-submit-btn"><span class="btn-text">Se connecter</span></button>
        </form>

        <form class="auth-form" id="register-form">
          <div class="input-stack"><label for="register-username">Pseudo</label><input type="text" id="register-username" placeholder="Ex : ApexRacer" autocomplete="nickname" maxlength="24" required></div>
          <div class="input-stack"><label for="register-email">Adresse e-mail</label><input type="email" id="register-email" placeholder="pilote@domaine.com" autocomplete="email" required></div>
          <div class="input-stack"><label for="register-password">Mot de passe</label><input type="password" id="register-password" placeholder="6 caractères minimum" autocomplete="new-password" required minlength="6"></div>
          <div class="input-stack"><label for="register-car">Ta voiture actuelle</label><input type="text" id="register-car" placeholder="Ex : 206 Quiksilver 1.6 16V" maxlength="80" required></div>
          <label class="check-row consent-row"><input type="checkbox" id="register-consent" required><span>J'ai 15 ans ou plus et j'accepte les <a href="#/legal/cgu" target="_blank" rel="noopener">conditions d'utilisation</a> et la <a href="#/legal/confidentialite" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>
          <div class="form-feedback error-txt" id="register-error" role="alert"></div>
          <button type="submit" class="cta-btn fill-btn w-100">Créer mon compte</button>
        </form>
      </div>
    </div>
  </div>
