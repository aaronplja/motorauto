name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Icone de l'application
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('../assets/icon-512.png').convert('RGBA')
          base = 'android/app/src/main/res'
          for d, s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = base + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  im.save(p + '/' + n)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - name: Compiler l'APK
        working-directory: apk/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MOTORAUTO-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
